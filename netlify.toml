# ============================================================================
#  Cashflow Compass — Netlify configuration
#
#  publish = "site" is a privacy control, not just tidiness. Only what lives in
#  site/ is uploaded, so repository files physically cannot ride along on a
#  deploy — including THEME-HANDOFF.md (marked "Local only — gitignored"), the
#  .claude/ tooling directory, this config, and .git/ history.
#
#  A drag-and-drop deploy of the repository root previously uploaded all of it,
#  because a manual folder drop never consults .gitignore. Blocking those paths
#  with redirect rules only stopped them being *served* — the bytes still
#  reached the CDN. Keeping the deployable files in their own folder removes
#  the problem at the source, so no blocklist has to be maintained.
#
#  Deploy by pointing Netlify at site/, or drag the site/ folder itself.
# ============================================================================

[build]
  publish = "site"

# ----------------------------------------------------------------------------
#  Content-Security-Policy — the privacy promise, machine-enforced
#
#  Both libraries (Chart.js, SheetJS) are vendored under site/vendor/, so the
#  app needs nothing external and every fetch directive can be locked to 'self'.
#
#  style-src needs 'unsafe-inline': index.html carries its whole stylesheet in an
#  inline <style> block, the feature modules inject their own <style> elements,
#  and category colours are written into style="" attributes. script-src does
#  NOT need it — every script is a <script src>, and there are no inline event
#  handlers. tests.html asserts both of those stay true.
#
#  connect-src is 'self', not 'none'. sw.js is served from this origin and so
#  inherits this policy; inside a service worker, connect-src governs the
#  worker's own fetch() and Cache API adds. 'none' would break both precaching
#  and the cache-miss fallback, leaving the worker unable to install. 'self'
#  keeps the guarantee that matters — no request may leave this origin — while
#  letting the shell cache itself.
#
#  worker-src/manifest-src are stated explicitly rather than inherited from
#  default-src, so that tightening default-src later cannot silently break
#  service worker registration or the manifest fetch.
# ----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
